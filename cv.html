<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon CV - Haroon ZAHID</title>
    <style>
        :root { --primary: #00e599; --secondary: #10b981; --bg: #050505; --card-bg: #121212; --text: #e5e7eb; --text-muted: #9ca3af; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background-color: var(--bg); color: var(--text); line-height: 1.6; }
        
        header { background-color: rgba(5, 5, 5, 0.95); padding: 1rem 5%; position: fixed; width: 90%; top: 0; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; z-index: 1000; }
        nav a { color: var(--text); text-decoration: none; margin-left: 20px; font-weight: 500; transition: 0.3s; letter-spacing: 0.5px; }
        nav a:hover, nav a.active { color: var(--primary); text-shadow: 0 0 10px rgba(0, 229, 153, 0.4); }
        nav a.active { border-bottom: 2px solid var(--primary); padding-bottom: 5px; }

        section { padding: 120px 10%; text-align: center; }
        h2 { font-size: 2rem; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 2px; }

        /* CV Image Container */
        .cv-container { margin-bottom: 30px; position: relative; display: inline-block; }
        .cv-image {
            width: 100%;
            max-width: 800px;
            height: auto;
            border-radius: 2px;
            box-shadow: 0 0 30px rgba(0, 229, 153, 0.15); /* Lueur verte derrière le CV */
            border: 1px solid #333;
        }

        .btn { background-color: var(--primary); color: #000; padding: 12px 25px; border-radius: 4px; text-decoration: none; font-weight: bold; transition: all 0.2s; display: inline-block; text-transform: uppercase; letter-spacing: 1px; font-size: 0.9rem; }
        .btn:hover { background-color: #fff; box-shadow: 0 0 15px rgba(0, 229, 153, 0.5); }

        footer { text-align: center; padding: 40px; border-top: 1px solid #333; color: var(--text-muted); font-size: 0.8rem; }
    </style>
</head>
<body>

    <header>
        <div style="font-weight:800; font-size:1.4rem; letter-spacing:1px;">HAROON <span style="color:var(--primary)">ZAHID</span></div>
        <nav>
            <a href="index.html">ACCUEIL</a>
            <a href="parcours.html">PARCOURS</a>
            <a href="cv.html" class="active">MON CV</a>
            <a href="contact.html">CONTACT</a>
        </nav>
    </header>

    <section>
        <h2>Mon Curriculum Vitae</h2>
        <p style="color:var(--text-muted); margin-bottom: 30px;">Version Officielle à jour.</p>
        
        <div class="cv-container">
            <img src="Cv_Officiel_Haroon_Zahid_page-0001.jpg" alt="CV Haroon Zahid" class="cv-image">
        </div>
        <br>
        <a href="Cv_Officiel_Haroon_Zahid.pdf" class="btn" download>📥 Télécharger le PDF</a>
    </section>

    <footer>
        <p>&copy; 2026 - Portfolio Haroon ZAHID</p>
    </footer>

</body>
</html>
