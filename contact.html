<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Contact - Haroon ZAHID</title>
    <style>
        :root { --primary: #00e599; --bg: #050505; --card-bg: #121212; --text: #e5e7eb; }
        body { margin: 0; font-family: 'Consolas', 'Monaco', monospace; background-color: var(--bg); color: var(--text); overflow-x: hidden; }
        
        body::before { content: " "; display: block; position: fixed; top: 0; left: 0; bottom: 0; right: 0; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06)); z-index: 999; background-size: 100% 2px, 3px 100%; pointer-events: none; }

        header { background-color: rgba(5,5,5,0.95); padding: 1rem 2%; position: fixed; width: 96%; top: 0; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; z-index: 1000; }
        nav { display: flex; gap: 15px; }
        nav a { color: var(--text); text-decoration: none; font-size: 0.9rem; text-transform: uppercase; transition: 0.3s; }
        nav a:hover, nav a.active { color: var(--primary); text-shadow: 0 0 10px rgba(0,229,153,0.8); }

        section { padding: 120px 10%; max-width: 800px; margin: 0 auto; }
        h2 { border-left: 4px solid var(--primary); padding-left: 15px; margin-bottom: 40px; text-transform: uppercase; letter-spacing: 2px; }
        
        .contact-form { background: var(--card-bg); padding: 30px; border: 1px solid #333; }
        
        input, textarea { width: 100%; padding: 10px; margin-bottom: 15px; background: #000; border: 1px solid #333; color: white; font-family: monospace; box-sizing: border-box; }
        .btn { background: transparent; color: var(--primary); padding: 15px 20px; border: 1px solid var(--primary); font-weight: bold; cursor: pointer; width: 100%; text-transform: uppercase; }
        .btn:hover { background: var(--primary); color: black; }
    </style>
</head>
<body>
    <header>
        <div style="font-weight:800; color:var(--primary); letter-spacing:2px;">[ HAROON.Z ]</div>
        <nav>
            <a href="index.html">Accueil</a>
            <a href="formations.html">Formations</a>
            <a href="competences.html">Compétences</a>
            <a href="projets.html">Projets</a>
            <a href="stages.html">Stages</a>
            <a href="veille.html">Veille</a>
            <a href="contact.html" class="active">Contact</a>
        </nav>
    </header>

    <section>
        <h2>Me Contacter</h2>
        <div class="contact-form">
            <p>> <strong>Email :</strong> Haroonzahidpro@gmail.com</p>
            <hr style="border:0; border-top:1px dashed #333; margin:20px 0;">
            
            <form name="contact-urgence" method="POST" netlify>
                
                <input type="hidden" name="form-name" value="contact-urgence" />

                <label>NOM :</label>
                <input type="text" name="name" required placeholder="Votre nom">
                
                <label>EMAIL :</label>
                <input type="email" name="email" required placeholder="Votre email">
                
                <label>MESSAGE :</label>
                <textarea name="message" rows="6" required placeholder="Votre message..."></textarea>
                
                <button type="submit" class="btn">ENVOYER (TEST)</button>
            </form>
        </div>
    </section>

    <div id="theme-toggle" title="Changer de Mode"><span id="toggle-icon">🛡️</span></div>
    <style>:root{--primary:#00e599;--next-color:#00f3ff;--bg:#050505;--card-bg:#121212;--text:#e5e7eb;--text-muted:#9ca3af}body.blue-mode{--primary:#00f3ff;--next-color:#00e599;--bg:#0a0f1c;--card-bg:#161b2e;--text:#e0f7fa;--text-muted:#94a3b8}#theme-toggle{position:fixed;bottom:30px;right:30px;width:50px;height:50px;background-color:var(--card-bg);border:2px solid var(--next-color);color:var(--next-color);border-radius:50%;display:flex;justify-content:center;align-items:center;cursor:pointer;z-index:100000;transition:0.3s;box-shadow:0 0 10px rgba(0,0,0,0.5)}#theme-toggle:hover{transform:scale(1.1) rotate(15deg);box-shadow:0 0 20px var(--next-color);background-color:var(--next-color)}body:not(.blue-mode) #theme-toggle:hover #toggle-icon{filter:grayscale(100%) brightness(0)}#theme-toggle:hover #toggle-icon{filter:grayscale(100%) brightness(0) invert(1)}#toggle-icon{font-size:24px;transition:0.3s;user-select:none;line-height:1;margin-top:2px}</style>
    <script>const tBtn=document.getElementById('theme-toggle'),tIcon=document.getElementById('toggle-icon'),bd=document.body;const cTheme=localStorage.getItem('theme');if(cTheme==='blue'){bd.classList.add('blue-mode');tIcon.textContent='💀'}else{tIcon.textContent='🛡️'}tBtn.addEventListener('click',()=>{bd.classList.toggle('blue-mode');if(bd.classList.contains('blue-mode')){localStorage.setItem('theme','blue');tIcon.textContent='💀'}else{localStorage.setItem('theme','green');tIcon.textContent='🛡️'}})</script>
</body>
</html>
