<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Contact - Haroon ZAHID</title>
    <style>
        :root { --primary: #00e599; --bg: #050505; --card-bg: #121212; --text: #e5e7eb; }
        body { margin: 0; font-family: 'Consolas', 'Monaco', monospace; background-color: var(--bg); color: var(--text); overflow-x: hidden; }
        
        body::before { content: " "; display: block; position: fixed; top: 0; left: 0; bottom: 0; right: 0; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06)); z-index: 999; background-size: 100% 2px, 3px 100%; pointer-events: none; }

        header { background-color: rgba(5,5,5,0.95); padding: 1rem 2%; position: fixed; width: 96%; top: 0; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; z-index: 1000; }
        nav { display: flex; gap: 15px; }
        nav a { color: var(--text); text-decoration: none; font-size: 0.9rem; text-transform: uppercase; transition: 0.3s; }
        nav a:hover, nav a.active { color: var(--primary); text-shadow: 0 0 10px rgba(0,229,153,0.8); }

        section { padding: 120px 10%; max-width: 800px; margin: 0 auto; }
        h2 { border-left: 4px solid var(--primary); padding-left: 15px; margin-bottom: 40px; text-transform: uppercase; letter-spacing: 2px; }
        
        .contact-form { 
            background: var(--card-bg); padding: 30px; border: 1px solid #333; 
            opacity: 0; transform: translateY(30px); animation: slideUp 0.8s ease-out forwards;
        }
        
        input, textarea { 
            width: 100%; padding: 10px; margin-bottom: 15px; background: #000; border: 1px solid #333; color: white; 
            font-family: monospace; transition: 0.3s; box-sizing: border-box;
        }
        input:focus, textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 10px rgba(0,229,153,0.2); }
        
        .btn { 
            background: transparent; color: var(--primary); padding: 15px 20px; border: 1px solid var(--primary); 
            font-weight: bold; cursor: pointer; width: 100%; text-transform: uppercase; letter-spacing: 2px; transition: 0.3s;
        }
        .btn:hover { background: var(--primary); color: black; box-shadow: 0 0 20px var(--primary); }

        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

</div>

<style>
    /* Style de l'écran de transition */
    #page-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #000; /* Fond noir */
        z-index: 99999; /* Au-dessus de tout */
        display: flex;
        justify-content: center;
        align-items: center;
        transition: opacity 0.5s ease-in-out, visibility 0.5s;
        opacity: 1; /* Visible par défaut au chargement */
        visibility: visible;
    }

    /* Quand la page est chargée, on cache le loader */
    body.loaded #page-loader {
        opacity: 0;
        visibility: hidden;
    }

    /* Le texte du loader */
    .loader-text {
        color: var(--primary, #00e599); /* Utilise ta couleur verte */
        font-family: 'Consolas', monospace;
        font-size: 1.5rem;
        letter-spacing: 3px;
        margin-bottom: 10px;
        animation: blink 0.5s infinite alternate;
    }

    /* La barre de chargement animée */
    .loader-bar {
        width: 200px;
        height: 2px;
        background: #333;
        position: relative;
        overflow: hidden;
    }
    .loader-bar::after {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: var(--primary, #00e599);
        animation: loading 1.5s infinite;
    }

    @keyframes loading {
        0% { left: -100%; }
        50% { left: 100%; }
        100% { left: 100%; }
    }
    
    @keyframes blink {
        from { opacity: 1; }
        to { opacity: 0.5; }
    }
</style>

<script>
    // 1. Au chargement de la page : On enlève l'écran noir
    window.addEventListener('load', () => {
        // Petit délai pour admirer l'effet "Hacker"
        setTimeout(() => {
            document.body.classList.add('loaded');
        }, 400); 
    });

    // 2. Au clic sur un lien : On remet l'écran noir avant de changer de page
    document.querySelectorAll('a').forEach(link => {
        link.addEventListener('click', function(e) {
            // Si c'est un téléchargement ou un lien externe, on ne fait rien
            if (this.hasAttribute('download') || this.target === '_blank') return;
            
            // Sinon, on intercepte le clic
            e.preventDefault();
            const targetUrl = this.href;

            // On remet l'écran noir (enlève la classe 'loaded')
            document.body.classList.remove('loaded');

            // On attend 500ms (le temps de la transition CSS) avant de changer de page
            setTimeout(() => {
                window.location.href = targetUrl;
            }, 500);
        });
    });
</script>

<div id="theme-toggle" title="Changer de Mode (Hacker / Defense)">
    <span id="toggle-icon">🛡️</span>
</div>

<style>
    /* 1. Mode par Défaut (VERT / HACKER) */
    :root {
        --primary: #00e599;      /* Vert Néon (Couleur actuelle) */
        --next-color: #00f3ff;   /* Cyan Électrique (Couleur du bouton/mode suivant) */
        --bg: #050505;           /* Noir */
        --card-bg: #121212;      /* Gris très foncé */
        --text: #e5e7eb;         /* Blanc cassé */
        --text-muted: #9ca3af;   /* Gris */
    }

    /* 2. Mode "BLUE TEAM" (BLEU NUIT / CYAN) */
    body.blue-mode {
        --primary: #00f3ff;      /* Cyan Électrique (Couleur actuelle) */
        --next-color: #00e599;   /* Vert Néon (Couleur du bouton/mode suivant) */
        --bg: #0a0f1c;           /* Bleu Nuit Profond */
        --card-bg: #161b2e;      /* Bleu Nuit plus clair */
        --text: #e0f7fa;         /* Blanc bleuté */
        --text-muted: #94a3b8;   /* Gris bleu */
    }

    /* --- STYLE DU BOUTON --- */
    #theme-toggle {
        position: fixed;
        bottom: 30px;
        right: 30px;
        width: 50px;
        height: 50px;
        background-color: var(--card-bg);
        /* Le contour prend la couleur du mode VERS lequel on va aller */
        border: 2px solid var(--next-color);
        color: var(--next-color);
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        z-index: 100000;
        transition: 0.3s;
        box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }

    #theme-toggle:hover {
        transform: scale(1.1) rotate(15deg);
        /* L'ombre et le fond deviennent la couleur suivante */
        box-shadow: 0 0 20px var(--next-color);
        background-color: var(--next-color);
    }

    /* Gestion de la couleur de l'icône au survol pour le contraste */
    #theme-toggle:hover #toggle-icon {
        filter: grayscale(100%) brightness(0) invert(1); /* Devient Blanc */
    }
    /* Si on est en mode normal (Vert) et qu'on survole (le fond devient Cyan clair), on met l'icône en noir pour que ce soit lisible */
    body:not(.blue-mode) #theme-toggle:hover #toggle-icon {
        filter: grayscale(100%) brightness(0); /* Devient Noir */
    }

    #toggle-icon {
        font-size: 24px;
        transition: 0.3s;
        user-select: none;
        line-height: 1;
        margin-top: 2px;
    }
</style>

<script>
    const toggleButton = document.getElementById('theme-toggle');
    const toggleIcon = document.getElementById('toggle-icon');
    const body_theme = document.body;

    // Vérifier si l'utilisateur a déjà choisi un thème
    const currentTheme = localStorage.getItem('theme');

    // Appliquer le thème sauvegardé
    if (currentTheme === 'blue') {
        body_theme.classList.add('blue-mode');
        toggleIcon.textContent = '💀'; // Mode Bleu actif -> On propose le mode Hacker
    } else {
        toggleIcon.textContent = '🛡️'; // Mode Vert actif -> On propose le mode Défense
    }

    // Action au clic
    toggleButton.addEventListener('click', () => {
        body_theme.classList.toggle('blue-mode');

        if (body_theme.classList.contains('blue-mode')) {
            localStorage.setItem('theme', 'blue');
            toggleIcon.textContent = '💀';
        } else {
            localStorage.setItem('theme', 'green');
            toggleIcon.textContent = '🛡️';
        }
    });
</script>
</body>
</html>
