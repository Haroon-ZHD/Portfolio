<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accueil - Haroon ZAHID</title>
    <style>
        /* --- THEME HACKER AVANCÉ --- */
        :root { 
            --primary: #00e599; 
            --bg: #050505; 
            --card-bg: #121212; 
            --text: #e5e7eb; 
            --text-muted: #9ca3af; 
        }
        
        body { 
            margin: 0; 
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            background-color: var(--bg); 
            color: var(--text); 
            line-height: 1.6; 
            overflow-x: hidden;
        }

        /* Scanline Effect */
        body::before {
            content: " "; display: block; position: fixed; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 999; background-size: 100% 2px, 3px 100%; pointer-events: none;
        }

        /* Header */
        header { background-color: rgba(5,5,5,0.95); padding: 1rem 2%; position: fixed; width: 96%; top: 0; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; z-index: 1000; }
        nav { display: flex; gap: 15px; flex-wrap: wrap; }
        nav a { color: var(--text); text-decoration: none; font-size: 0.9rem; font-weight: 500; transition: 0.3s; text-transform: uppercase; position: relative; }
        nav a:hover, nav a.active { color: var(--primary); text-shadow: 0 0 10px rgba(0,229,153,0.8); }
        nav a::after { content: ''; position: absolute; width: 0; height: 2px; bottom: -5px; left: 0; background-color: var(--primary); transition: width 0.3s; }
        nav a:hover::after, nav a.active::after { width: 100%; }

        /* Hero Section */
        .hero { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; background: radial-gradient(circle at center, #111 0%, #050505 80%); padding: 0 20px; }
        
        /* Animation Glitch CORRIGÉE */
        h1 { font-size: 4rem; margin-bottom: 10px; position: relative; color: var(--text); letter-spacing: 2px; }
        h1 span { color: var(--primary); }
        
        .glitch { position: relative; }
        .glitch::before, .glitch::after {
            content: attr(data-text); /* Prend le texte exact défini dans le HTML */
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        }
        .glitch::before { left: 2px; text-shadow: -1px 0 #ff00c1; clip: rect(44px, 450px, 56px, 0); animation: glitch-anim 5s infinite linear alternate-reverse; }
        .glitch::after { left: -2px; text-shadow: -1px 0 #00fff9; clip: rect(44px, 450px, 56px, 0); animation: glitch-anim2 5s infinite linear alternate-reverse; }

        @keyframes glitch-anim {
            0% { clip: rect(30px, 9999px, 10px, 0); }
            5% { clip: rect(80px, 9999px, 90px, 0); }
            100% { clip: rect(10px, 9999px, 50px, 0); }
        }
        @keyframes glitch-anim2 {
            0% { clip: rect(60px, 9999px, 80px, 0); }
            5% { clip: rect(10px, 9999px, 40px, 0); }
            100% { clip: rect(90px, 9999px, 20px, 0); }
        }

        /* Typewriter Effect */
        .typewriter {
            display: inline-block; overflow: hidden; border-right: .15em solid var(--primary); white-space: nowrap; margin: 0 auto; letter-spacing: .10em;
            animation: typing 3.5s steps(40, end), blink-caret .75s step-end infinite; max-width: 100%;
        }
        @keyframes typing { from { width: 0 } to { width: 100% } }
        @keyframes blink-caret { from, to { border-color: transparent } 50% { border-color: var(--primary); } }

        /* Fade In Up */
        .fade-in { opacity: 0; transform: translateY(30px); animation: fadeInUp 0.8s ease-out forwards; }
        .delay-2 { animation-delay: 1.5s; opacity: 0; animation: fadeInUp 0.8s ease-out 1.5s forwards; }
        @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }

        /* Boutons */
        .btn-container { margin-top: 40px; }
        .btn { 
            background-color: transparent; color: var(--primary); padding: 12px 30px; border: 1px solid var(--primary); border-radius: 2px; text-decoration: none; font-weight: bold; display: inline-block; text-transform: uppercase; letter-spacing: 2px; transition: 0.3s; position: relative; overflow: hidden; margin: 0 10px;
        }
        .btn::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: var(--primary); transition: 0.4s; z-index: -1; }
        .btn:hover { color: #000; box-shadow: 0 0 20px var(--primary); }
        .btn:hover::before { left: 0; }

    </style>
</head>
<body>
    <header class="fade-in">
        <div style="font-weight:800; color:var(--primary); letter-spacing:2px;">[ HAROON.Z ]</div>
        <nav>
            <a href="index.html">Accueil</a>
            <a href="a-propos.html">À propos</a>
            <a href="formations.html">Formations</a>
            <a href="competences.html">Compétences</a>
            <a href="projets.html">Projets</a>
            <a href="stages.html">Stages</a>
            <a href="veille.html">Veille</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <section class="hero">
        <div class="fade-in">
            <h1 class="glitch" data-text="Haroon ZAHID">Haroon <span>ZAHID</span></h1>
        </div>
        
        <div style="font-size:1.2rem; color:var(--text-muted); max-width:800px; margin-bottom:30px; height: 30px;">
            <div class="typewriter">
                Étudiant BTS SIO | SISR & Cybersécurité
            </div>
        </div>

        <div class="btn-container delay-2">
            <a href="projets.html" class="btn">Mes Projets</a>
            <a href="contact.html" class="btn">Me Contacter</a>
        </div>
    </section>
    
    <div id="theme-toggle" title="Changer de Mode (Hacker / Defense)">
    <span id="toggle-icon">🛡️</span>
</div>

<style>
    /* 1. Mode par Défaut (VERT / HACKER) */
    :root {
        --primary: #00e599;      /* Vert Néon (Couleur actuelle) */
        --next-color: #00f3ff;   /* Cyan Électrique (Couleur du bouton/mode suivant) */
        --bg: #050505;           /* Noir */
        --card-bg: #121212;      /* Gris très foncé */
        --text: #e5e7eb;         /* Blanc cassé */
        --text-muted: #9ca3af;   /* Gris */
    }

    /* 2. Mode "BLUE TEAM" (BLEU NUIT / CYAN) */
    body.blue-mode {
        --primary: #00f3ff;      /* Cyan Électrique (Couleur actuelle) */
        --next-color: #00e599;   /* Vert Néon (Couleur du bouton/mode suivant) */
        --bg: #0a0f1c;           /* Bleu Nuit Profond */
        --card-bg: #161b2e;      /* Bleu Nuit plus clair */
        --text: #e0f7fa;         /* Blanc bleuté */
        --text-muted: #94a3b8;   /* Gris bleu */
    }

    /* --- STYLE DU BOUTON --- */
    #theme-toggle {
        position: fixed;
        bottom: 30px;
        right: 30px;
        width: 50px;
        height: 50px;
        background-color: var(--card-bg);
        /* Le contour prend la couleur du mode VERS lequel on va aller */
        border: 2px solid var(--next-color);
        color: var(--next-color);
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        z-index: 100000;
        transition: 0.3s;
        box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }

    #theme-toggle:hover {
        transform: scale(1.1) rotate(15deg);
        /* L'ombre et le fond deviennent la couleur suivante */
        box-shadow: 0 0 20px var(--next-color);
        background-color: var(--next-color);
    }

    /* Gestion de la couleur de l'icône au survol pour le contraste */
    #theme-toggle:hover #toggle-icon {
        filter: grayscale(100%) brightness(0) invert(1); /* Devient Blanc */
    }
    /* Si on est en mode normal (Vert) et qu'on survole (le fond devient Cyan clair), on met l'icône en noir pour que ce soit lisible */
    body:not(.blue-mode) #theme-toggle:hover #toggle-icon {
        filter: grayscale(100%) brightness(0); /* Devient Noir */
    }

    #toggle-icon {
        font-size: 24px;
        transition: 0.3s;
        user-select: none;
        line-height: 1;
        margin-top: 2px;
    }
</style>

<script>
    const toggleButton = document.getElementById('theme-toggle');
    const toggleIcon = document.getElementById('toggle-icon');
    const body_theme = document.body;

    // Vérifier si l'utilisateur a déjà choisi un thème
    const currentTheme = localStorage.getItem('theme');

    // Appliquer le thème sauvegardé
    if (currentTheme === 'blue') {
        body_theme.classList.add('blue-mode');
        toggleIcon.textContent = '💀'; // Mode Bleu actif -> On propose le mode Hacker
    } else {
        toggleIcon.textContent = '🛡️'; // Mode Vert actif -> On propose le mode Défense
    }

    // Action au clic
    toggleButton.addEventListener('click', () => {
        body_theme.classList.toggle('blue-mode');

        if (body_theme.classList.contains('blue-mode')) {
            localStorage.setItem('theme', 'blue');
            toggleIcon.textContent = '💀';
        } else {
            localStorage.setItem('theme', 'green');
            toggleIcon.textContent = '🛡️';
        }
    });
</script>

</body>
</html>
