<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Message Envoyé - Haroon ZAHID</title>
    <style>
        :root { --primary: #00e599; --bg: #050505; --text: #e5e7eb; }
        body { margin: 0; font-family: 'Consolas', 'Monaco', monospace; background-color: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; height: 100vh; text-align: center; }
        .success-box { border: 2px solid var(--primary); padding: 40px; max-width: 500px; box-shadow: 0 0 20px var(--primary); animation: popIn 0.5s ease-out; }
        h1 { color: var(--primary); margin-top: 0; text-transform: uppercase; letter-spacing: 2px; }
        p { font-size: 1.1rem; margin-bottom: 30px; }
        .btn-back { background: var(--primary); color: #000; text-decoration: none; padding: 15px 30px; font-weight: bold; text-transform: uppercase; transition: 0.3s; display: inline-block; }
        .btn-back:hover { background: #fff; box-shadow: 0 0 15px #fff; }
        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>
    <div class="success-box">
        <div style="font-size: 4rem; margin-bottom: 20px;">✅</div>
        <h1>Transmission Réussie</h1>
        <p>Votre message a bien été envoyé au serveur sécurisé.</p>
        <p style="font-size: 0.9rem; color: #888;">Je vous répondrai dans les plus brefs délais.</p>
        <br>
        <a href="index.html" class="btn-back">< RETOUR À LA BASE</a>
    </div>
</body>
</html>
